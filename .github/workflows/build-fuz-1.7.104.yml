name: Build Fuz Ro D'oh for Skyrim 1.7.104

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-fuz-1.7.104.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout native 1.7.104 port branch
        uses: actions/checkout@v4
        with:
          ref: skyrim-1.7.104-native-port
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch current SKSE and legacy dependencies
        shell: pwsh
        run: |
          git clone https://github.com/ianpatt/skse64.git ..\skse64
          git -C ..\skse64 checkout 25b72352adb6543fa6d0bd3795780672b2e238e0

          git clone https://github.com/ianpatt/common.git ..\common
          # Fuz's old project expects ianpatt/common to be flat at ../common,
          # while current SKSE still references ../common/common. Keep both layouts.
          Copy-Item ..\common\common\* ..\common\ -Recurse -Force

          git clone https://github.com/shadeMe/SME-Sundries.git ..\SME-Sundries

          New-Item -ItemType Directory -Force -Path .ci-skyrim\Data\SKSE\Plugins | Out-Null

      - name: Build legacy source against SKSE 2.3.1
        shell: pwsh
        run: |
          $skyrim = (Resolve-Path .ci-skyrim).Path
          $sme = (Resolve-Path ..\SME-Sundries).Path
          msbuild "Fuz Ro D'oh 64.vcxproj" /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:Skyrim64Path="$skyrim" `
            /p:SMESundriesIncludePath="$sme"

      - name: Collect compile candidate
        if: success()
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "Fuz Ro D'oh.dll" | Where-Object { $_.FullName -notlike '*package*' } | Select-Object -First 1
          if (-not $dll) { throw "Fuz Ro D'oh.dll not found" }
          New-Item -ItemType Directory -Force -Path compile-output | Out-Null
          Copy-Item $dll.FullName compile-output\Fuz-Ro-D-oh-compile-baseline.dll
          @"
          COMPILE BASELINE ONLY - DO NOT INSTALL IN SKYRIM YET
          Source branch: skyrim-1.7.104-native-port
          SKSE source: 25b72352adb6543fa6d0bd3795780672b2e238e0 (current 2.3.1-era source)
          The runtime hook addresses are still being validated for Skyrim 1.7.104.0.
          "@ | Set-Content compile-output\README.txt

      - name: Upload compile baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fuz-Ro-D-oh-1.7.104-Compile-Baseline
          path: compile-output
