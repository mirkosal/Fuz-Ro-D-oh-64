name: Build Fuz Ro D'oh for Skyrim 1.7.104

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-fuz-1.7.104.yml'

# Functional test build for Skyrim 1.7.104.  The four enclosing functions are
# resolved through Address Library v13 IDs and all five in-function hook sites
# are structurally validated before any branch is written.
jobs:
  build:
    runs-on: windows-2022
    env:
      FUZ_VCPKG_ROOT: C:\vcpkg-fuz

    steps:
      - name: Checkout CommonLib 1.7.104 port
        uses: actions/checkout@v4
        with:
          ref: skyrim-1.7.104-clib-port
          fetch-depth: 0

      - name: Apply validated Skyrim 1.7.104 functional hooks
        shell: pwsh
        run: python ci/patch_fuz_runtime_v5.py

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup current vcpkg
        shell: pwsh
        run: |
          if (Test-Path $env:FUZ_VCPKG_ROOT) { Remove-Item -Recurse -Force $env:FUZ_VCPKG_ROOT }
          git clone https://github.com/microsoft/vcpkg.git $env:FUZ_VCPKG_ROOT
          & "$env:FUZ_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure CommonLibSSE-NG 7.4 port
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:FUZ_VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package full Vortex test mod
        if: success()
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter 'FuzRoDoh.dll' | Select-Object -First 1
          if (-not $dll) { throw 'FuzRoDoh.dll not found' }

          New-Item -ItemType Directory -Force -Path "package\SKSE\Plugins" | Out-Null
          New-Item -ItemType Directory -Force -Path "package\Sound\Voice\Fuz Ro Doh" | Out-Null
          Copy-Item $dll.FullName "package\SKSE\Plugins\Fuz Ro D'oh.dll"

          Get-ChildItem -LiteralPath '[Depends]' -Filter 'Stock_*.fuz' | ForEach-Object {
            Copy-Item $_.FullName "package\Sound\Voice\Fuz Ro Doh\$($_.Name)"
          }

          @"
          Fuz Ro D'oh FUNCTIONAL TEST PORT for Skyrim runtime 1.7.104.0
          SKSE 2.3.1
          CommonLibSSE-NG 7.4.0
          Branch: skyrim-1.7.104-clib-port
          Source commit: $(git rev-parse HEAD)

          Address Library v13 IDs:
            CachedResponseData ctor: 35249
            UIUtils::QueueDialogSubtitles: 52854
            ASCM::DisplayQueuedNPCChatterData: 52637
            ASCM::QueueNPCChatterData: 52626

          Hook sites validated from the user's Skyrim 1.7.104 diagnostic log.
          QueueNPCChatterData's non-display exit moved from upstream +0xCA to +0x186.
          This is still a test build: verify startup and unvoiced dialogue before normal play.
          "@ | Set-Content package\BUILD_INFO.txt

          Compress-Archive -Path package\* -DestinationPath "Fuz-Ro-D-oh-Skyrim-1.7.104-Functional-Test-v5.zip" -Force

      - name: Upload Vortex test ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fuz-Ro-D-oh-Skyrim-1.7.104-Functional-Test-v5
          path: Fuz-Ro-D-oh-Skyrim-1.7.104-Functional-Test-v5.zip
